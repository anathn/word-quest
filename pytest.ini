[pytest]
# Set TESTING environment variable for all test runs
# This allows ProfileManager to accept temporary file paths for unit tests
env =
    TESTING=1

# Test discovery options
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution options
# With SDL dummy drivers, pygame font rendering can segfault in parallel mode.
# Use single worker (-n 1) for stability with dummy video driver.
# Note: Tests are grouped by file (--dist=loadfile) to minimize pygame state issues.
# Timeout: 10 seconds per test to prevent hangs (2157 tests should complete in <1 min)
addopts = -v --tb=short -n 1 --dist=loadfile --timeout=10
